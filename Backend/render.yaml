services:
  - type: web
    name: ipp-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ipp.tg,https://admin.ipp.tg,https://www.ipp.tg
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /api/health
