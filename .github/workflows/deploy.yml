name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/client/package-lock.json
            Frontend/admin/package-lock.json
      - name: Build client
        working-directory: Frontend/client
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://ipp-backend.onrender.com/api
          VITE_SUPABASE_URL: https://knmxosdfxxzjagqyhkcc.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtubXhvc2RmeHh6amFncXloa2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjIzODIsImV4cCI6MjEwNTMzODM4Mn0.ntWtzeHibJRUpqWZIWREz6yk555xKrGPH28fu3acIKg
          VITE_USE_MOCK: "false"
      - name: Build admin
        working-directory: Frontend/admin
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: https://ipp-backend.onrender.com/api
          VITE_SUPABASE_URL: https://knmxosdfxxzjagqyhkcc.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtubXhvc2RmeHh6amFncXloa2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjIzODIsImV4cCI6MjEwNTMzODM4Mn0.ntWtzeHibJRUpqWZIWREz6yk555xKrGPH28fu3acIKg
          VITE_USE_MOCK: "false"
      - name: Assemble Pages
        run: |
          rm -rf _site
          mkdir -p _site/admin
          cp -r Frontend/client/dist/* _site/
          cp -r Frontend/admin/dist/* _site/admin/
          cp _site/index.html _site/404.html
          cp _site/admin/index.html _site/admin/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
